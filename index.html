/* Layout: layar PID satu halaman untuk kelas X SMALB murid Tuli. Pita alur kegiatan di atas, panggung dengan
   judul besar dan kotak kata kunci di kanan atas, area kerja di bawah, bilah guru paling bawah.
   Semua yang diucapkan juga tampil sebagai teks (strip teks di bawah panggung). Satu tema terang yang tegas:
   merah tua Pancasila, biru tua, dan emas; sengaja satu tema untuk kontras tinggi di layar PID. */
:root{
  --pri:#8E2B2E; --pri-d:#651C20; --pri-l:#F7ECEA; --pri-2:#FBF6F5;
  --navy:#2C4A6E; --navy-l:#E3E9F1; --head:#1F2E45;
  --ink:#22262C; --muted:#655F5E; --line:#E3D6D3; --paper:#FFFFFF; --ground:#F6F2F1;
  --gold:#D9A441; --gold-d:#A9741C; --gold-l:#FBF0D9;
  --ok:#3E8E5A; --ok-l:#E3F2E8; --warn:#C9503B;
  --u1:#3F78B5; --u1l:#E3EDF8; --u2:#3E8E5A; --u2l:#E3F2E8; --u3:#D9A02E; --u3l:#FBF0D9;
  --display:'Lexend MPI','Lexend','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson MPI','Atkinson Hyperlegible','Segoe UI',Roboto,system-ui,sans-serif;
  --r:clamp(10px,1.6vh,18px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
svg{display:block}
svg.ico{width:100%;height:100%}
input,select,textarea{font:inherit;color:var(--ink)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}

/* ---------- bilah atas: alur kegiatan */
.top{display:flex;align-items:center;gap:clamp(8px,1.2vw,22px);padding:clamp(6px,.9vh,10px) max(16px,1.6vw);background:var(--pri-d);color:#fff}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:none;max-width:22vw}
.brand b{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.1vh,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:clamp(11px,1.5vh,15px);color:#F0D5D1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases{flex:1;display:flex;gap:4px;min-width:0}
.ph{min-width:0;border-radius:8px;padding:clamp(5px,.8vh,9px) clamp(6px,.6vw,10px);color:#fff;font-weight:700;font-size:clamp(11px,1.5vh,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.45;background:rgba(255,255,255,.12)}
.ph i{font-style:normal;font-weight:400;opacity:.85}
.ph.on{opacity:1;background:var(--gold);color:var(--pri-d);box-shadow:0 0 0 3px #fff}
.code{flex:none;text-align:right;font-size:clamp(11px,1.45vh,15px);color:#F0D5D1;white-space:nowrap;max-width:14vw;overflow:hidden}
.code b{display:block;color:var(--gold);font-family:var(--display);font-size:clamp(13px,1.8vh,19px)}
.tpill{flex:none;display:flex;align-items:center;gap:8px;background:#fff;color:var(--head);border-radius:14px;padding:4px 12px 4px 6px;font-weight:700;text-align:left}
.tpill .rgw svg{width:clamp(28px,4.4vh,46px);height:clamp(28px,4.4vh,46px)}
.tpill .tt{display:block;font-family:var(--display);font-size:clamp(14px,2.2vh,24px);font-variant-numeric:tabular-nums;line-height:1.1}
.tpill small{display:block;font-size:clamp(10px,1.3vh,13px);color:var(--muted);white-space:nowrap;max-width:12em;overflow:hidden;text-overflow:ellipsis}
.tpill.end{background:var(--gold-l);box-shadow:0 0 0 3px var(--gold)}
@media (max-width:1100px){.ph i{display:none}.brand{max-width:28vw}}
@media (max-width:700px){.brand,.code{display:none}.ph{font-size:11px;padding:5px}}

/* ---------- panggung */
.stage{position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(8px,1.3vh,18px);padding:clamp(10px,1.7vh,22px) max(16px,2.4vw) clamp(10px,1.7vh,20px)}
.head{display:flex;align-items:flex-start;gap:clamp(10px,1.2vw,20px);min-width:0}
.say-btn{flex:none;width:clamp(46px,7.6vh,84px);height:clamp(46px,7.6vh,84px);border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 4px 0 var(--gold-d);color:var(--pri-d)}
.say-btn svg{width:52%;height:52%}
.say-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.htext{min-width:0;flex:1}
.kick{font-weight:700;color:var(--pri);font-size:clamp(12px,1.75vh,18px);letter-spacing:.07em;text-transform:uppercase}
.htext h1{margin:.12em 0 0;font-family:var(--display);font-weight:700;color:var(--head);font-size:clamp(20px,min(5vh,3.8vw),58px);line-height:1.12;text-wrap:balance}
.side-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:44%;flex:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.kwbox{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 8px}
.kwbox .kl{font-size:clamp(10px,1.3vh,13px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.kw{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--pri-l);color:var(--pri-d);font-weight:700;font-size:clamp(12px,1.7vh,18px);padding:4px 10px 4px 6px}
.kw .ki{width:1.3em;height:1.3em;color:var(--pri)}
.kw.ok{background:var(--ok-l);color:var(--ok)}
.play{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(10px,1.7vh,22px);overflow-y:auto;overflow-x:hidden;padding:8px 4px 4px}
.play>:first-child{margin-top:auto}
body.mid .play>:last-child{margin-bottom:auto}
.capstrip{position:absolute;left:50%;bottom:clamp(8px,1.4vh,16px);transform:translateX(-50%);max-width:min(1400px,calc(100% - 32px));background:rgba(20,22,28,.92);color:#fff;font-family:var(--display);font-weight:600;font-size:clamp(17px,3.2vh,36px);line-height:1.3;padding:.35em .9em;border-radius:14px;text-align:center;z-index:35;pointer-events:none;opacity:0;transition:opacity .25s}
.capstrip.on{opacity:1}
.capstrip small{display:block;font-family:var(--body);font-size:.45em;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
@media (max-width:760px){.head{flex-wrap:wrap}.side-r{max-width:100%;flex-basis:100%;align-items:flex-start}.tools,.kwbox{justify-content:flex-start}.say-btn{width:44px;height:44px}.htext h1{font-size:clamp(20px,6.2vw,30px)}}

/* ---------- komponen dasar */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:clamp(36px,4.8vh,50px);padding:4px clamp(10px,1vw,16px);border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:clamp(12px,1.6vh,17px);color:var(--head)}
.chip svg{width:1.2em;height:1.2em;flex:none}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:inline-flex;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden;flex-wrap:wrap}
.seg button{min-height:clamp(34px,4.6vh,48px);padding:0 clamp(10px,1vw,16px);font-weight:700;font-size:clamp(12px,1.6vh,17px);color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}
.mchips{display:flex;gap:clamp(6px,.8vw,12px);justify-content:center;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:8px;min-height:clamp(42px,6vh,64px);padding:4px clamp(12px,1.2vw,20px) 4px 4px;border-radius:999px;background:#fff;border:3px solid var(--mc);font-family:var(--display);font-weight:700;font-size:clamp(14px,2.2vh,24px);color:var(--ink)}
.mchip .sym{width:clamp(32px,4.8vh,52px);height:clamp(32px,4.8vh,52px);border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center;flex:none}
.mchip .sym svg{width:56%;height:56%}
.mchip small{font-family:var(--body);font-weight:700;font-size:.55em;color:var(--muted);display:block;line-height:1}
.mchip.on{background:var(--mc);color:#fff}.mchip.on small{color:#fff}
.mchip.on .sym{background:#fff;color:var(--mc)}
.mchip.gr{--mc:var(--head)}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1vh,12px);padding:clamp(10px,1.4vh,18px) clamp(12px,1.1vw,20px);border-radius:calc(var(--r)*1.3);background:#fff;box-shadow:0 5px 0 var(--line);border:4px solid transparent;min-width:0}
.pc .art{height:var(--ah,20vh);display:grid;place-items:center;max-width:100%}
.pc .art svg{height:100%;width:auto;max-width:100%}
.pc b{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.6vh,30px);color:var(--head);text-align:center;line-height:1.15}
.pc small{font-size:clamp(12px,1.8vh,19px);color:var(--muted);text-align:center;line-height:1.3}
.pc.sel{border-color:var(--gold);background:var(--gold-l)}
.pc.ok{border-color:var(--ok);background:var(--ok-l)}
.hint{animation:hint 1.2s 2}
@keyframes hint{50%{box-shadow:0 0 0 8px rgba(217,164,65,.55)}}
.row{display:flex;gap:clamp(12px,1.8vw,36px);align-items:stretch;justify-content:center;flex-wrap:wrap;width:100%}
.goal{display:flex;align-items:center;gap:14px;background:var(--pri);color:#fff;border-radius:22px;padding:clamp(8px,1.3vh,14px) clamp(18px,2vw,30px);font-family:var(--display);font-weight:700;font-size:clamp(15px,2.6vh,30px);text-align:left;max-width:100%}
.goal small{font-family:var(--body);font-size:.55em;letter-spacing:.1em;text-transform:uppercase;color:#F6D9D4;font-weight:700;flex:none}
.prompt{font-family:var(--display);font-weight:700;font-size:clamp(17px,3vh,34px);color:var(--head);background:var(--gold-l);border:3px solid var(--gold);border-radius:22px;padding:.35em 1em;text-align:center;max-width:100%}
.panel{background:#fff;border-radius:calc(var(--r)*1.4);box-shadow:0 5px 0 var(--line);padding:clamp(10px,1.6vh,20px) clamp(12px,1.4vw,24px);width:100%;min-width:0}
.ptitle{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.4vh,26px);color:var(--head);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ptitle i{font-style:normal;font-size:.55em;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--pri);border-radius:999px;padding:.3em .8em}
.inp,textarea.ta{width:100%;min-height:clamp(42px,5.6vh,60px);border-radius:12px;border:3px solid var(--line);padding:8px 12px;font-size:clamp(15px,2.2vh,23px);background:#fff;user-select:text;-webkit-user-select:text}
textarea.ta{min-height:clamp(90px,14vh,170px);line-height:1.45;resize:vertical}
.small{font-size:clamp(13px,1.8vh,17px);color:var(--muted);line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,24px);width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.2vw,20px);width:100%}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:100%}
@media (max-width:900px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* alur kegiatan */
.agenda{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:100%}
.ag{position:relative;display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:calc(var(--r)*1.3);padding:clamp(10px,1.6vh,18px);box-shadow:0 5px 0 var(--line);border-top:8px solid var(--ac)}
.ag .n{font-family:var(--display);font-weight:700;color:var(--ac);font-size:clamp(20px,3.6vh,40px);line-height:1}
.ag b{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.4vh,26px);color:var(--head)}
.ag span{font-size:clamp(13px,1.9vh,20px);color:var(--ink);line-height:1.35}
.ag em{font-style:normal;font-weight:700;font-size:clamp(12px,1.6vh,16px);color:var(--muted)}
@media (max-width:900px){.agenda{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* percakapan (MMR: perdati, percami, visualisasi) */
.dlg{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);width:100%;max-height:46vh;min-height:clamp(150px,28vh,400px);overflow-y:auto;background:#fff;border-radius:calc(var(--r)*1.4);padding:clamp(10px,1.6vh,18px);box-shadow:0 5px 0 var(--line)}
.bub{display:flex;gap:10px;align-items:flex-start;max-width:86%}
.bub.me{align-self:flex-end;flex-direction:row-reverse}
.bub .av{flex:none;width:clamp(34px,5vh,54px);height:clamp(34px,5vh,54px);border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center}
.bub .av svg{width:56%;height:56%}
.bub .tx{background:var(--mt);border:3px solid var(--mc);border-radius:18px;padding:.35em .8em;font-family:var(--display);font-weight:600;font-size:clamp(17px,3vh,34px);color:var(--ink);line-height:1.25}
.bub .tx small{display:block;font-family:var(--body);font-weight:700;font-size:.45em;color:var(--mc);letter-spacing:.06em;text-transform:uppercase}
.bub .tx .w{border-radius:6px;padding:0 2px;cursor:pointer}
.bub .tx .w.mk{background:var(--gold);color:var(--head)}
.dlg .empty{color:var(--muted);font-size:clamp(14px,2.2vh,22px);text-align:center;padding:16px;margin:auto 0}
.composer{display:flex;flex-direction:column;gap:8px;width:100%}
.composer .line{display:flex;gap:8px;align-items:center}
.composer .line .inp{flex:1}

/* papan beda–sama */
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,24px);width:100%}
.col{border-radius:calc(var(--r)*1.4);border:4px dashed var(--cc);background:var(--cl);padding:clamp(10px,1.6vh,18px);min-height:clamp(140px,28vh,320px);display:flex;flex-direction:column;gap:8px}
.col h3{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(20px,4vh,46px);color:var(--cc)}
.notes{display:flex;flex-wrap:wrap;gap:8px}
.sticky{display:inline-flex;align-items:center;gap:8px;background:#fff;border-left:8px solid var(--mc);border-radius:10px;padding:6px 10px;font-weight:700;font-size:clamp(14px,2.3vh,25px);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.sticky button{color:var(--muted);width:1.3em;height:1.3em}
@media (max-width:600px){.cols2{grid-template-columns:1fr}}

/* kartu kata kunci */
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:100%}
.vcard{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border-radius:calc(var(--r)*1.2);padding:clamp(8px,1.3vh,14px) clamp(10px,1vw,16px);box-shadow:0 4px 0 var(--line);border-left:8px solid var(--pri)}
.vcard .vi{flex:none;width:clamp(36px,6vh,64px);height:clamp(36px,6vh,64px);border-radius:14px;background:var(--pri-l);color:var(--pri);display:grid;place-items:center;padding:8px}
.vcard b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(15px,2.5vh,27px);color:var(--head);line-height:1.1}
.vcard span{display:block;font-size:clamp(12px,1.75vh,18px);color:var(--muted);line-height:1.3}
.vcard .sg{margin-left:auto;flex:none;width:clamp(26px,3.6vh,38px);height:clamp(26px,3.6vh,38px);border-radius:50%;border:3px solid var(--line);color:transparent;display:grid;place-items:center;padding:4px}
.vcard.signed .sg{background:var(--ok);border-color:var(--ok);color:#fff}
@media (max-width:1100px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.vgrid{grid-template-columns:1fr}}

/* teks tiga tingkat */
.tierwrap{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(12px,2vw,36px);align-items:center;width:100%}
.tierwrap .art{height:clamp(140px,34vh,400px);display:grid;place-items:center}
.tierwrap .art svg{height:100%;width:auto;max-width:100%}
.ttext{background:#fff;border-radius:calc(var(--r)*1.4);box-shadow:0 5px 0 var(--line);padding:clamp(14px,2.4vh,30px) clamp(16px,2vw,36px);border-left:12px solid var(--tc)}
.ttext .tl{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700;color:var(--muted);font-size:clamp(12px,1.7vh,17px);letter-spacing:.06em;text-transform:uppercase}
.ttext .tl b{font-family:var(--display);font-size:1.6em;color:#fff;background:var(--tc);border-radius:10px;padding:0 .4em;letter-spacing:0}
.ttext p{margin:0;font-family:var(--display);font-weight:500;color:var(--ink);line-height:1.45;text-wrap:pretty}
.ttext p.A{font-size:clamp(16px,2.7vh,30px)} .ttext p.B{font-size:clamp(18px,3.3vh,38px)} .ttext p.C{font-size:clamp(21px,4.2vh,48px);line-height:1.5}
.ttext mark{background:var(--gold-l);color:var(--pri-d);border-bottom:3px solid var(--gold);padding:0 .1em;border-radius:4px;cursor:pointer}
@media (max-width:760px){.tierwrap{grid-template-columns:1fr}.tierwrap .art{height:140px}}

/* fakta Banuroja */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:100%}
.fact{display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:var(--r);padding:clamp(8px,1.4vh,16px);box-shadow:0 4px 0 var(--line);border-top:6px solid var(--navy)}
.fact b{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.4vh,50px);color:var(--navy);line-height:1}
.fact span{font-weight:700;font-size:clamp(13px,1.9vh,20px);color:var(--ink)}
.fact small{font-size:clamp(11px,1.6vh,16px);color:var(--muted)}
.where{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;font-size:clamp(13px,2vh,21px)}
.where span{background:var(--navy-l);color:var(--navy);border-radius:999px;padding:4px 12px}
.where i{font-style:normal;color:var(--muted)}
@media (max-width:900px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* pilah ke kelompok (modal sosial, inklusif) */
.bins3{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(8px,1.2vw,20px);width:100%}
.bin{display:flex;flex-direction:column;gap:8px;border-radius:calc(var(--r)*1.4);border:4px dashed var(--bc);background:var(--bl);padding:clamp(8px,1.4vh,16px);min-height:clamp(120px,22vh,260px);text-align:left}
.bin .bh{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vh,32px);color:var(--bc)}
.bin .bh .bi{width:clamp(30px,5vh,56px);height:clamp(30px,5vh,56px);flex:none}
.bin .bh small{display:block;font-family:var(--body);font-size:.5em;color:var(--muted)}
.bin .in{display:flex;flex-direction:column;gap:6px}
.scard2{display:block;text-align:left;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:clamp(13px,2vh,21px);line-height:1.3;border:3px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--ink)}
.scard2.sel{border-color:var(--gold);background:var(--gold-l)}
.bin .in .scard2{box-shadow:none;border-color:var(--bc);font-size:clamp(12px,1.7vh,18px)}
.tray2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1vw,14px);width:100%}
@media (max-width:900px){.bins3{grid-template-columns:1fr}.tray2{grid-template-columns:1fr}}

/* papan tulis ganda: analisis 5W1H */
.split{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:calc(var(--r)*1.4);overflow:hidden;box-shadow:0 6px 0 var(--line);background:#fff;min-height:0}
.side{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);padding:clamp(10px,1.6vh,20px) clamp(12px,1.4vw,24px);min-width:0}
.side+.side{border-left:4px solid var(--line)}
.side .scene{position:relative;height:clamp(110px,22vh,260px);display:grid;place-items:center}
.side .scene svg{height:100%;width:auto;max-width:100%;border-radius:12px}
.tags{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.tags i{width:clamp(16px,2.4vh,26px);height:clamp(16px,2.4vh,26px);border-radius:50%;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.qgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center}
.qgrid label{font-weight:700;font-size:clamp(12px,1.75vh,18px);color:var(--head);white-space:nowrap}
.qgrid .inp{min-height:clamp(34px,4.6vh,48px);font-size:clamp(13px,1.9vh,19px);padding:4px 10px;border-width:2px}
.utag{display:flex;gap:6px;flex-wrap:wrap}
.utag button{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:3px solid var(--uc);background:#fff;font-weight:700;font-size:clamp(12px,1.6vh,16px);padding:4px 10px;color:var(--ink)}
.utag button i{width:12px;height:12px;border-radius:50%;background:var(--uc)}
.utag button.on{background:var(--uc);color:#fff}.utag button.on i{background:#fff}
@media (max-width:900px){.split{grid-template-columns:1fr}.side+.side{border-left:0;border-top:4px solid var(--line)}}

/* modal sosial: 3 unsur */
.uns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2vw,20px);width:100%}
.un{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--ul);border:4px solid var(--uc);border-radius:calc(var(--r)*1.4);padding:clamp(10px,1.6vh,18px)}
.un .ui{width:clamp(40px,8vh,90px);height:clamp(40px,8vh,90px);color:var(--uc)}
.un b{font-family:var(--display);font-weight:700;font-size:clamp(17px,3vh,34px);color:var(--uc)}
.un span{font-size:clamp(13px,2vh,21px);color:var(--ink)}
.formula{font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vh,32px);color:var(--head);text-align:center}
.formula span{padding:0 .3em;border-radius:8px}

/* video lokal bersubtitle */
.vid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(10px,1.4vw,24px);width:100%;align-items:start}
